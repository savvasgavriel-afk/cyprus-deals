"https://jsbqhdwxuhiejjnwiwbe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kXuBKDd0IFAzPUyHR_zsEg_4rRD3uPn";

let accessToken="";
let currentUser=null;
let myBusiness=null;
let offers=[];

async function api(path,options={}){
  const headers={
    "apikey":SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  if(accessToken){
    headers.Authorization="Bearer "+accessToken;
  }

  const r=await fetch(SUPABASE_URL+path,{
    ...options,
    headers
  });

  const text=await r.text();

  let data=null;
  try{data=text?JSON.parse(text):null}catch(e){data=text}

  if(!r.ok){
    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.hint ||
      "Σφάλμα"
    );
  }

  return data;
}

function show(id){
  document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if(id==="offers") loadOffers();
  if(id==="dashboard") dashboard();
}

async function register(){

  const email=document.getElementById("regEmail").value.trim();
  const password=document.getElementById("regPassword").value;
  const name=document.getElementById("regName").value.trim();
  const category=document.getElementById("regCategory").value.trim();
  const city=document.getElementById("regCity").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  const address=document.getElementById("regAddress").value.trim();

  const msg=document.getElementById("regMsg");

  if(!email||!password||!name){
    msg.className="msg danger";
    msg.textContent="Συμπλήρωσε email, κωδικό και όνομα επιχείρησης.";
    return;
  }

  try{

    const u=await api("/auth/v1/signup",{
      method:"POST",
      body:JSON.stringify({
        email,
        password
      })
    });

    if(!u?.user){
      throw new Error("Δεν δημιουργήθηκε ο λογαριασμός.");
    }

    await api("/rest/v1/businesses",{
      method:"POST",
      headers:{
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        owner_id:u.user.id,
        name,
        category,
        city,
        phone,
        address,
        approved:false,
        featured:false
      })
    });

    msg.className="msg success";
    msg.textContent=
      "Ο λογαριασμός δημιουργήθηκε. Έλεγξε το email σου για επιβεβαίωση.";

  }catch(e){

    msg.className="msg danger";
    msg.textContent=e.message;
  }
}

async function login(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const msg=document.getElementById("loginMsg");

  try{

    const x=await api(
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    accessToken=x.access_token;
    currentUser=x.user;

    msg.className="msg success";
    msg.textContent="Επιτυχής σύνδεση!";

    setTimeout(()=>{
      show("dashboard");
    },500);

  }catch(e){

    msg.className="msg danger";
    msg.textContent=e.message;
  }
}

async function getBusiness(){

  if(!currentUser)return null;

  const d=await api(
    "/rest/v1/businesses?select=*&owner_id=eq."
    +encodeURIComponent(currentUser.id)
  );

  myBusiness=d?.[0]||null;

  return myBusiness;
}

async function dashboard(){

  if(!accessToken||!currentUser){

    document.getElementById("businessInfo").innerHTML=
      '<div class="msg">Πρέπει πρώτα να συνδεθείς ως επιχείρηση.</div>';

    return;
  }

  try{

    const b=await getBusiness();

    if(!b){

      document.getElementById("businessInfo").innerHTML=
        '<div class="msg danger">Δεν βρέθηκε επιχείρηση.</div>';

      return;
    }

    document.getElementById("businessInfo").innerHTML=`
      <div class="card">
        <h3>🏪 ${escapeHtml(b.name)}</h3>
        <p>📍 ${escapeHtml(b.city||"")}</p>
        <p>📞 ${escapeHtml(b.phone||"")}</p>
        <p>Κατηγορία: ${escapeHtml(b.category||"")}</p>
        <p>Κατάσταση:
          <b>${b.approved?"✅ Εγκεκριμένη":"⏳ Σε αναμονή έγκρισης"}</b>
        </p>
      </div>
    `;

    await loadMyOffers();

  }catch(e){

    document.getElementById("businessInfo").innerHTML=
      '<div class="msg danger">'+escapeHtml(e.message)+'</div>';
  }
}
