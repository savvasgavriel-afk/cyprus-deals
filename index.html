<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyprus Deals</title><style>body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}header{background:linear-gradient(135deg,#078bea,#16b6df);color:#fff;padding:35px 15px;text-align:center}main{max-width:850px;margin:auto;padding:15px}button{border:0;border-radius:16px;padding:14px 18px;background:#078bea;color:white;font-weight:bold;font-size:16px;margin:5px;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:1px solid #ddd;border-radius:14px;font-size:16px}.panel,.offer{background:#fff;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}.hidden{display:none}.price{font-size:23px;color:#078bea;font-weight:bold}.old{text-decoration:line-through;color:#888;margin-left:8px}.error{background:#fee2e2;padding:10px;border-radius:10px}.ok{background:#dcfce7;padding:10px;border-radius:10px}</style></head><body><header><h1>🎁 Cyprus Deals</h1><p>Οι καλύτερες προσφορές στην Κύπρο</p></header><main><div><button onclick="show('offers')">🎁 Προσφορές</button><button onclick="show('register')">🏪 Νέα επιχείρηση</button><button onclick="show('login')">🔐 Σύνδεση</button><button onclick="show('dash')">📊 Dashboard</button></div><section id="offers" class="panel"><h2>🎁 Προσφορές</h2><input id="search" placeholder="🔎 Αναζήτηση..." oninput="render()"><div id="list">Φόρτωση προσφορών...</div></section><section id="login" class="panel hidden"><h2>🔐 Σύνδεση επιχείρησης</h2><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Κωδικός"><button onclick="login()">Σύνδεση</button><div id="lm"></div></section><section id="register" class="panel hidden"><h2>🏪 Νέα επιχείρηση</h2><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Κωδικός"><input id="bn" placeholder="Όνομα επιχείρησης"><textarea id="bd" placeholder="Περιγραφή"></textarea><input id="bc" placeholder="Κατηγορία π.χ. food"><input id="bp" placeholder="Τηλέφωνο"><input id="ba" placeholder="Διεύθυνση"><input id="bcity" placeholder="Πόλη"><button onclick="register()">Δημιουργία λογαριασμού</button><div id="rm"></div></section><section id="dash" class="panel hidden"><h2>📊 Dashboard</h2><div id="bi"></div><h3>➕ Νέα προσφορά</h3><input id="ot" placeholder="Τίτλος"><textarea id="od" placeholder="Περιγραφή"></textarea><input id="op" type="number" step=".01" placeholder="Τιμή"><input id="oop" type="number" step=".01" placeholder="Παλιά τιμή"><input id="ol" placeholder="Τοποθεσία"><button onclick="addOffer()">➕ Προσθήκη</button><div id="om"></div><h3>📋 Οι προσφορές μου</h3><div id="mine"></div><button onclick="logout()">Έξοδος</button></section></main><script>
const URL='https://jsbqhdwxuhiejjnwiwbe.supabase.co',KEY='sb_publishable_kXuBKDd0IFAzPUyHR_zsEg_4rRD3uPn';let token='',user=null,biz=null,offers=[],businesses=[];
async function api(path,opt={}){let h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(URL+path,{...opt,headers:h}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||'Supabase error');return d}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='offers')load();if(id==='dash'){if(!token){show('login');return}dashboard()}}
async function register(){let e=re.value.trim(),p=rp.value,n=bn.value.trim(),m=rm;m.innerHTML='';try{let x=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p})});if(x.access_token){token=x.access_token;user=x.user;await createBiz();show('dash')}else{m.innerHTML='<div class="ok">✅ Έλεγξε το email σου και μετά κάνε σύνδεση.</div>';le.value=e;show('login')}}catch(x){m.innerHTML='<div class="error">❌ '+x.message+'</div>'}}
async function createBiz(){let d=await api('/rest/v1/businesses',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({owner_id:user.id,name:bn.value.trim(),description:bd.value.trim(),category:bc.value.trim(),phone:bp.value.trim(),address:ba.value.trim(),city:bcity.value.trim(),approved:false,featured:false})});biz=d[0]}
async function login(){try{let x=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:le.value.trim(),password:lp.value})});token=x.access_token;user=x.user;await getBiz();show('dash')}catch(x){lm.innerHTML='<div class="error">❌ '+x.message+'</div>'}}
async function getBiz(){let d=await api('/rest/v1/businesses?select=*&owner_id=eq.'+encodeURIComponent(user.id));biz=d[0]||null}
async function dashboard(){await getBiz();bi.innerHTML=biz?'<div class="ok"><b>🏪 '+esc(biz.name)+'</b><br>'+esc(biz.city||'')+'<br>'+ (biz.approved?'✅ Εγκεκριμένη':'⏳ Αναμονή έγκρισης')+'</div>':'<div class="error">Δεν βρέθηκε επιχείρηση.</div>';loadMine()}
async function addOffer(){try{await api('/rest/v1/offers',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({title:ot.value.trim(),description:od.value.trim(),price:Number(op.value),old_price:oop.value?Number(oop.value):null,business_id:biz.id,location:ol.value.trim()||biz.city||'',active:true})});om.innerHTML='<div class="ok">✅ Προσφορά προστέθηκε!</div>';ot.value=od.value=op.value=oop.value=ol.value='';loadMine();load()}catch(x){om.innerHTML='<div class="error">❌ '+x.message+'</div>'}}
async function loadMine(){let d=await api('/rest/v1/offers?select=*&business_id=eq.'+biz.id+'&order=id.desc');mine.innerHTML=d.length?d.map(o=>'<div class="offer"><b>'+esc(o.title)+'</b><br>€'+Number(o.price).toFixed(2)+' <button onclick="del('+o.id+')">🗑️ Διαγραφή</button></div>').join(''):'Δεν έχεις προσφορές.'}
async function del(id){if(!confirm('Να διαγραφεί;'))return;try{await api('/rest/v1/offers?id=eq.'+id,{method:'DELETE'});loadMine();load()}catch(x){alert(x.message)}}
async function load(){try{offers=await api('/rest/v1/offers?select=*&active=eq.true&order=id.desc')||[];businesses=await api('/rest/v1/businesses?select=id,name,category,city')||[];render()}catch(x){list.innerHTML='<div class="error">❌ '+x.message+'</div>'}}
function render(){let q=search.value.toLowerCase();let a=offers.filter(o=>(o.title+' '+(o.description||'')+' '+(o.location||'')).toLowerCase().includes(q));list.innerHTML=a.length?a.map(o=>{let b=businesses.find(x=>+x.id===+o.business_id);return '<div class="offer"><h3>🎁 '+esc(o.title)+'</h3><div>🏪 '+esc(b?.name||'Επιχείρηση')+'</div><p>'+esc(o.description||'')+'</p><span class="price">€'+Number(o.price).toFixed(2)+'</span>'+(o.old_price?'<span class="old">€'+Number(o.old_price).toFixed(2)+'</span>':'')+'<p>📍 '+esc(o.location||'')+'</p><button onclick="alert(\'🎉 Δείξε την προσφορά στην επιχείρηση.\')">🎁 Πάρε την προσφορά</button></div>'}).join(''):'Δεν βρέθηκαν προσφορές.'}
function logout(){token='';user=null;biz=null;show('offers')}function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}load();
</script></body></html>
